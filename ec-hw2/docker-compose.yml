# EC HW2 databases: MongoDB + Neo4j, on your own computer.
# Start:   docker compose -f ec-hw2/docker-compose.yml --env-file ec-hw2/.env up -d
# Stop:    docker compose -f ec-hw2/docker-compose.yml --env-file ec-hw2/.env stop
# Never run "down -v": it deletes the database volumes.
# The sharded MongoDB demo is a separate file: ec-hw2/scaleout/docker-compose.sharded.yml
name: truthlag

services:
  mongo:
    image: mongo:8.0            # same major version as the Atlas free tier
    command: ["--wiredTigerCacheSizeGB", "1"]
    ports: ["127.0.0.1:27017:27017"]   # only this computer can connect
    volumes: [mongo_data:/data/db]
    mem_limit: 1.5g
    restart: unless-stopped

  neo4j:
    image: neo4j:2026.10.1      # Community edition; GDS + APOC are bundled in this image
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in ec-hw2/.env}"
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_server_memory_heap_initial__size: 1500m
      NEO4J_server_memory_heap_max__size: 1500m
      NEO4J_server_memory_pagecache_size: 1g
    ports:
      - "127.0.0.1:7474:7474"   # Neo4j Browser: http://localhost:7474
      - "127.0.0.1:7687:7687"   # Bolt (Python driver)
    volumes:
      - neo4j_data:/data
      - ../data/neo4j/import:/import:ro      # CSV files for LOAD CSV
      - ../data/neo4j/plugins:/plugins
    mem_limit: 3g
    restart: unless-stopped

volumes:
  mongo_data:
  neo4j_data:
